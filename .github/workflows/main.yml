name: fr-monitor

on:
  schedule:
    - cron: '*/5 * * * *'   # GitHub's minimum; runs may be delayed 5-15 min when busy
  workflow_dispatch:

permissions:
  contents: write            # to commit state.json (positions, cooldowns, telegram offset)

concurrency:
  group: fr-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node monitor.js
      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state update"
            git pull --rebase
            git push
          fi
